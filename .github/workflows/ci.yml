name: CI

on:
  push:
    branches:
      - main
      - Sonar-Cloud
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install project dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run Mutation Testing
        run: mutmut run --max-children 4

      - name: Export mutation statistics
        run: mutmut export-cicd-stats

      - name: Validate minimum Mutation Score above 60%
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          archivo = Path("mutants/mutmut-cicd-stats.json")

          if not archivo.exists():
              print("ERROR: Mutation statistics file not found.")
              sys.exit(1)

          with archivo.open(encoding="utf-8") as f:
              datos = json.load(f)

          eliminados = datos["killed"]
          total = datos["total"]

          if total <= 0:
              print("ERROR: No mutants available to calculate the score.")
              sys.exit(1)

          score = eliminados / total * 100
          minimo = 60.0

          print(f"Mutants killed: {eliminados}")
          print(f"Total mutants: {total}")
          print(f"Mutation Score: {score:.2f}%")
          print(f"Minimum threshold: {minimo:.2f}%")

          if score <= minimo:
              print("ERROR: Mutation Score must be above 60%.")
              sys.exit(1)

          print("OK: Mutation Score passed.")
          PY
